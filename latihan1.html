<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LATIHAN PERTEMUAN 1</title>
</head>
<style>
    * {
        margin: 0;
        padding: 0;
        font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
    }
    body {
        background-color: #a8ffec;
    }
    header {
        background-color: aliceblue;
        padding: 10px;
        text-align: center;
        justify-content: center;
    }
    .head {
        display: flex;
        justify-content: space-between;
    }
    .content {
        display: flex;
        gap: 15px;
        padding: 20px;
        justify-content: space-evenly;
    }
    .left {
        padding: 20px;
        background-color: rgba(255, 255, 255, 0.54);
        border: 2px solid rgb(255, 254, 254);
        border-radius: 20px;
    }
    .right {
        padding: 20px;
        background-color: rgba(255, 255, 255, 0.54);
        border: 2px solid rgb(255, 254, 254);
        border-radius: 20px;
    }
    .form {
        display: flex;
        gap: 15px;
        padding: 20px;
        justify-content: space-evenly;
    }
    .form-isi {
        text-align: center;
        width: 100%;
        padding: 20px;
        background-color: rgba(255, 255, 255, 0.54);
        border: 2px solid rgb(255, 254, 254);
        border-radius: 20px;
    }
    .input {
        display: grid;
        gap: 20px;
    }
    input {
        width: 100%;
        height: 40px;
        border-radius: 10px;
    }
</style>
<body>
    <header>
        <div class="head">
            <h2>WEB IHSAN</h2>
            <nav>
                <a href="http://">HOME</a>
                <a href="http://">ABOUT</a>
                <a href="http://">CONTACT</a>
            </nav>
        </div>
    </header>
    <div class="content">
        <div class="left">
            <p>NAMA : IHSAN FADHILAH</p>
            <p>KELAS : 3E AXIOO</p>
            <p>MATKUL : DESAIN WEB</p>
        </div>
        <div class="right">
            <p>NAMA : IHSAN FADHILAH</p>
            <p>KELAS : 3E AXIOO</p>
            <p>MATKUL : DESAIN WEB</p>
        </div>
    </div>
    <div class="form">
        <div class="form-isi">
            <h2 style="margin-bottom: 18px;">MASUKKAN DATA</h2>
            <hr style="margin-bottom: 18px;">
            <div class="input">
                <input type="text" name="" id="" placeholder="  Masukkan Nama">
                <input type="text" name="" id="" placeholder="  Masukkan Jenis Kelamin">
            </div>
        </div>
    </div>
</body>
</html>
